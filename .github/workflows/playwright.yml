name: Playwright E2E

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymflow
          POSTGRES_PASSWORD: gymflow
          POSTGRES_DB: gymflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymflow -d gymflow_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://gymflow:gymflow@localhost:5432/gymflow_e2e
      E2E_SESSION_SECRET: ci-only-gymflow-playwright-session-secret
      E2E_OWNER_EMAIL: e2e-owner@gymflow.test
      E2E_OWNER_PASSWORD: e2e-test-password
      E2E_STAFF_EMAIL: e2e-staff@gymflow.test
      E2E_STAFF_PASSWORD: e2e-test-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Seed E2E data
        run: npm run test:e2e:seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
